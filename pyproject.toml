[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "workflow-automation-discovery-agent"
version = "0.2.0"
description = "Controlled intake, scoring, and product-card generation for workflow automation opportunities"
requires-python = ">=3.11"
dependencies = [
  "jsonschema>=4.20",
  "python-docx>=1.1",
]

[project.optional-dependencies]
agent = [
  "fastapi>=0.115,<1",
  "langchain-openai>=1.0,<2",
  "langgraph>=1.0,<1.2",
  "langgraph-checkpoint-postgres>=2.0,<3",
  "psycopg[binary,pool]>=3.2,<4",
  "pydantic>=2.8,<3",
  "uvicorn[standard]>=0.30,<1",
]
test = [
  "httpx>=0.28,<1",
  "pytest>=8,<10",
  "pytest-asyncio>=0.24,<2",
]

[project.scripts]
automation-intake = "use_case_agent.cli:main"
automation-intake-api = "use_case_agent.api:run"
automation-intake-migrate = "use_case_agent.migrate:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"

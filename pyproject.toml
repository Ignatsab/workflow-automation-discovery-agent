[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "workflow-automation-discovery-agent"
version = "0.1.0"
description = "Controlled intake, scoring, and product-card generation for workflow automation opportunities"
requires-python = ">=3.11"
dependencies = [
  "jsonschema>=4.20",
  "python-docx>=1.1",
]

[project.scripts]
automation-intake = "use_case_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

